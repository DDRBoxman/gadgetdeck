[package]
name = "gadgetdeck-display"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gadgetdeck-display"
path = "src/main.rs"

[dependencies]
gadgetdeck = { path = "../gadgetdeck" }

# USB gadget support (for UDC binding)
usb-gadget = "0.7"

# Logging
env_logger = "0.11"
log = "0.4"

# Signal handling
ctrlc = { version = "3.5.1", features = ["termination"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Raylib for framebuffer rendering
raylib = { git = "https://github.com/raylib-rs/raylib-rs", branch = "unstable", default-features = false, features = [
    "drm",
    "opengl_es_20",
    "GLFW_BUILD_X11",
    "USE_AUDIO",
    "SUPPORT_MODULE_RSHAPES",
    "SUPPORT_MODULE_RTEXTURES",
    "SUPPORT_MODULE_RTEXT",
    "SUPPORT_GESTURES_SYSTEM",
    "SUPPORT_MOUSE_GESTURES",
    "SUPPORT_FILEFORMAT_PNG",
    "SUPPORT_FILEFORMAT_JPG",
    "SUPPORT_DEFAULT_FONT",
    "SUPPORT_FILEFORMAT_TTF",
    "SUPPORT_STANDARD_FILEIO",
    "SUPPORT_TRACELOG",
] }
