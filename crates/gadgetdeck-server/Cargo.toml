[package]
name = "gadgetdeck-server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gadgetdeck-server"
path = "src/main.rs"

[dependencies]
gadgetdeck = { path = "../gadgetdeck" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# USB gadget support (for UDC binding)
usb-gadget = "0.7"

# Logging
env_logger = "0.11"
log = "0.4"

# Web server
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = "0.22"
parking_lot = "0.12"
